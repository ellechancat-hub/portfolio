
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #f5f4f0;
      font-family: sans-serif;
      color: #333;
    }

    header {
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 26px;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    p {
      color: #777;
      font-size: 14px;
    }

    .pdf-container {
      max-width: 1000px;
      margin: 20px auto;
      background: white;
      padding: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    iframe {
      width: 100%;
      height: 85vh;
      border: none;
    }

    .download {
      text-align: center;
      margin: 20px;
    }

    .download a {
      display: inline-block;
      padding: 12px 24px;
      background: #89998f;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
  </style>
</head>

<body>

  <header>
    <h1>PORTFOLIO</h1>
    <p>Design Works / 2026</p>
  </header>

  <div class="pdf-container">
    <iframe src="portfolio .pdf">
      PDFを表示できない場合は、
      <a href="portfolio .pdf">こちら</a>
      からご覧ください。
    </iframe>
  </div>

  <div class="download">
    <a href="portfolio .pdf" target="_blank">
      ポートフォリオを見る
    </a>
  </div>

</body>
</html>
